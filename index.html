<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小虎</title>

  <!-- 見た目の設定は style.css に分けています。 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="room" aria-label="小虎の縁側">
      <!-- 左側：白い大きな虎の小虎。画像ではなくCSSで描いています。 -->
      <div class="kotora-area">
        <div class="kotora" aria-label="白い大きな虎の小虎">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="stripe one"></div>
          <div class="stripe two"></div>
          <div class="stripe three"></div>
          <div class="stripe cheek-left"></div>
          <div class="stripe cheek-right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="muzzle"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>

        <div class="warm-items">
          <span>火鉢</span>
          <span>白湯</span>
          <span>モフモフ</span>
        </div>
      </div>

      <!-- 右側：入力欄、返答エリア、ボタン。 -->
      <div class="panel">
        <div>
          <p class="eyebrow">白虎型対話アプリ</p>
          <h1>小虎</h1>
        </div>

        <p class="lead">
          今の思いつきや気分を、機内持ち込み・預け入れ・今日は持たない荷物に軽く仕分ける小さな補助パネルです。
        </p>

        <!-- JavaScriptで、この中の文字を書き換えます。 -->
        <div class="speech" id="speech" aria-live="polite">
          浮かんだ荷物を、軽く仕分けよか。
        </div>

        <label for="message">今の一言</label>
        <input id="message" type="text" placeholder="例：ちょっと疲れた / メモしたいことがある">

        <div class="buttons">
          <button id="welcomeButton" type="button">機内持ち込み</button>
          <button id="tableButton" type="button">預け入れ荷物</button>
          <button id="leaveButton" type="button">今日は置いていく</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 動きの設定は script.js に分けています。 -->
  <script src="script.js"></script>
</body>
</html>
