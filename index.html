<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小虎の手ほどき</title>

  <!-- 見た目の設定は style.css に分けています。 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="room" aria-label="小虎の縁側">
      <!-- 左側：白い大きな虎の小虎。画像ではなくCSSで描いています。 -->
      <div class="kotora-area">
        <div class="kotora" aria-label="白い大きな虎の小虎">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="stripe one"></div>
          <div class="stripe two"></div>
          <div class="stripe three"></div>
          <div class="stripe cheek-left"></div>
          <div class="stripe cheek-right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="muzzle"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>

        <div class="warm-items">
          <span>火鉢</span>
          <span>白湯</span>
          <span>モフモフ</span>
        </div>
      </div>

      <!-- 右側：タイトル、札の表示エリア、ボタン。 -->
      <div class="panel">
        <div>
          <p class="eyebrow">白虎型ランダム札アプリ</p>
          <h1>小虎の手ほどき</h1>
        </div>

        <p class="subtitle">
          話すか、動くか。いま必要な直感を、小さく起動するための札。
        </p>

        <p class="lead">
          正しい答えではなく、出た札への「反応」を見ます。
        </p>

        <label for="todayQuestion">今日の問い</label>
        <input id="todayQuestion" type="text" placeholder="例：今なにを扱う？ / 今日は何を置いていく？">

        <!-- JavaScriptで、この中の文字を書き換えます。 -->
        <div class="card-result" id="cardResult" aria-live="polite">
          <span class="card-kind">小虎の札</span>
          <span class="card-number">--</span>
          <span class="card-title">話すか、動くか選んでな。</span>
          <span class="card-hint">問いを書いてから引くと、自分の反応が見えやすいで。</span>
        </div>

        <label for="bodyReaction">心身の反応</label>
        <input id="bodyReaction" type="text" placeholder="例：それは嫌 / あ、これや / 今日は置いていく">

        <div class="buttons">
          <button id="talkButton" type="button">話す</button>
          <button id="actionButton" type="button">行動する</button>
        </div>

        <p class="notice">
          このアプリは、気持ちや考えを仕分けるための小さな実験アプリです。医療・心理支援の代替ではありません。個人情報や秘密情報は入力しないでください。
        </p>
      </div>
    </section>
  </main>

  <!-- 動きの設定は script.js に分けています。 -->
  <script src="script.js"></script>
</body>
</html>
